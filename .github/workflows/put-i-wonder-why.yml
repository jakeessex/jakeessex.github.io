name: put-i-wonder-why
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download exact vocal
        run: |
          curl -fsSL -o audio/favourites/02-i-wonder-why.mp3 "https://tmpfiles.org/dl/1790202588.e86a5feb10e419c9/wKwxEveDbwVM/02-i-wonder-why.mp3"
          test "$(wc -c < audio/favourites/02-i-wonder-why.mp3)" -eq 3131658
      - name: commit vocal
        run: |
          git config user.name "jakeessex"
          git config user.email "jakeessexenquiries@gmail.com"
          git add audio/favourites/02-i-wonder-why.mp3
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Put Jake's I Wonder Why vocal on the site"
          git push
